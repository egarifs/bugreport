services:
  db:
    image: postgres:16-alpine
    container_name: bugreport-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: bugreport
      POSTGRES_USER: bugreport
      POSTGRES_PASSWORD: bugreport_dev_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - bugreport_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugreport -d bugreport"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bugreport_pgdata:
